<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCO JUANIL — Monitor Operacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070d; --panel:#0b1220; --line:rgba(0,229,255,.18);
  --cyan:#00e5ff; --lime:#b8ff3d; --amber:#ffb020; --red:#ff3b5c;
  --violet:#9b6bff; --muted:#7d8ba3; --text:#e8f4ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Rajdhani,system-ui,sans-serif}
body{
  background:
    radial-gradient(900px 400px at 10% -10%, rgba(0,229,255,.12), transparent 50%),
    radial-gradient(700px 380px at 110% 0%, rgba(155,107,255,.10), transparent 46%),
    linear-gradient(180deg,#070b14 0%,#05070d 100%);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.08;
  background-image:linear-gradient(rgba(0,229,255,.35) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(0,229,255,.35) 1px,transparent 1px);
  background-size:48px 48px;
}
.wrap{position:relative;z-index:1;padding:18px 22px 28px;max-width:1600px;margin:0 auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:Orbitron,sans-serif;font-size:1.55rem;letter-spacing:.12em;color:var(--cyan);text-shadow:0 0 18px rgba(0,229,255,.45)}
.brand span{color:var(--muted);font-size:.95rem;letter-spacing:.18em;text-transform:uppercase}
.meta{display:flex;gap:18px;align-items:flex-end;font-family:"Share Tech Mono",monospace}
.clock{font-size:2rem;color:var(--lime);letter-spacing:.06em;text-shadow:0 0 16px rgba(184,255,61,.35)}
.sub{color:var(--muted);font-size:.78rem;text-align:right}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{
  background:linear-gradient(180deg,rgba(12,22,38,.92),rgba(8,14,24,.92));
  border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;
  box-shadow:0 0 0 1px rgba(255,255,255,.02), inset 0 0 24px rgba(0,229,255,.04);
}
.kpi .l{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.kpi .n{font-family:Orbitron,sans-serif;font-size:1.8rem;margin-top:4px}
.c-cyan{color:var(--cyan)}.c-lime{color:var(--lime)}.c-amber{color:var(--amber)}
.c-red{color:var(--red)}.c-violet{color:var(--violet)}
.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}
@media(max-width:980px){.grid{grid-template-columns:1fr}}
.panel{
  background:rgba(8,14,24,.88);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.35);
}
.panel h3{
  font-family:Orbitron,sans-serif;font-size:.72rem;letter-spacing:.16em;color:var(--cyan);
  padding:12px 14px;border-bottom:1px solid var(--line);background:rgba(0,229,255,.04)
}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{text-align:left;font-size:.68rem;letter-spacing:.12em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.tbl tr:hover td{background:rgba(0,229,255,.05)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:700;letter-spacing:.04em}
.p-tl{background:rgba(0,229,255,.15);color:var(--cyan)}
.p-ls{background:rgba(255,176,32,.16);color:var(--amber)}
.p-cv{background:rgba(155,107,255,.18);color:var(--violet)}
.p-ht{background:rgba(184,255,61,.14);color:var(--lime)}
.p-ok{background:rgba(184,255,61,.14);color:var(--lime)}
.p-run{background:rgba(0,229,255,.14);color:var(--cyan)}
.p-loja{background:rgba(255,176,32,.16);color:var(--amber)}
.p-off{background:rgba(255,59,92,.16);color:var(--red)}
.feed{max-height:620px;overflow:auto}
.ev{display:grid;grid-template-columns:72px 1fr;gap:8px;padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.04)}
.ev time{font-family:"Share Tech Mono",monospace;color:var(--cyan);font-size:.78rem}
.ev b{display:block;font-size:.82rem;letter-spacing:.04em}
.ev small{color:var(--muted)}
.e-bau b{color:var(--amber)}
.e-fim b{color:var(--red)}
.e-ini b{color:var(--lime)}
.e-ret b{color:var(--violet)}
.e-cli b{color:var(--cyan)}
.bar{height:3px;background:rgba(0,229,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;width:30%;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scan 1.6s linear infinite}
@keyframes scan{from{transform:translateX(-120%)}to{transform:translateX(420%)}}
.empty{padding:28px;text-align:center;color:var(--muted)}
footer{margin-top:12px;color:var(--muted);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <b>CCO JUANIL</b>
      <span>Central de Controle Operacional</span>
    </div>
    <div class="meta">
      <div>
        <div class="clock" id="relogio">--:--:--</div>
        <div class="sub" id="subtitulo">Carregando malha…</div>
      </div>
    </div>
  </header>
  <div class="bar"><i></i></div>
  <div class="kpis" id="kpis"></div>
  <div class="grid">
    <div class="panel">
      <h3>Frota em movimento · dia operacional</h3>
      <div style="overflow:auto">
        <table class="tbl">
          <thead>
            <tr>
              <th>Placa</th><th>OP</th><th>Motorista</th><th>Último evento</th><th>Hora</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="tbody"><tr><td colspan="6" class="empty">Sincronizando Trucks…</td></tr></tbody>
        </table>
      </div>
    </div>
    <div class="panel">
      <h3>Radar de eventos</h3>
      <div class="feed" id="feed"><div class="empty">Aguardando pulso da Trucks…</div></div>
    </div>
  </div>
  <footer id="rodape">Atualização automática a cada 60s · dados TrucksLog + Controle</footer>
</div>
<script>
const CONTROLE = 'https://docs.google.com/spreadsheets/d/19ztgd86-ivwJveXp0Q_032P1fFaSuC9D9uaMJ4r6mP8/gviz/tq?tqx=out:csv&gid=1559964021';
const TRUCKS = 'https://docs.google.com/spreadsheets/d/1TtgHyiAFdj1jCZGfm4VYzqw-4bEluQ34c95cYH_M6OA/gviz/tq?tqx=out:csv&gid=149639861';

function agoraBRT(){
  return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Sao_Paulo'}));
}
function isoOperacional(){
  const d = agoraBRT();
  if (d.getHours() < 1) d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}
function br(iso){
  const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y;
}
function parseCsv(text){
  const rows=[]; let row=[], cell='', q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c!=='\r') cell+=c;
  }
  if(cell||row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function placa(v){ return String(v||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase(); }
function hh(v){ const m=String(v||'').match(/(\d{1,2}:\d{2})/); return m?m[1].padStart(5,'0'):''; }
function opClass(op){
  const o=String(op||'').toUpperCase();
  if(o==='TL') return 'p-tl'; if(o==='LS') return 'p-ls'; if(o==='CV') return 'p-cv'; if(o==='HT') return 'p-ht';
  return 'p-run';
}

async function pull(url){
  const r = await fetch(url+'&_='+Date.now(), {cache:'no-store'});
  return parseCsv(await r.text());
}

function statusDe(evs){
  const last = evs[evs.length-1] || {};
  const e = last.ev||'';
  if (e==='ABERTURA_BAU' || e==='INICIO_DESCARREGAMENTO') return ['BAÚ ABERTO','p-loja'];
  if (e==='CHEGADA_CLIENTE') return ['NA LOJA','p-loja'];
  if (e==='RETORNO') return ['RETORNO CD','p-run'];
  if (e==='PARADA_REFEICAO') return ['ALMOÇO','p-loja'];
  if (e==='FIM_VIAGEM' || e==='FIM_FINAL') return ['FIM','p-off'];
  if (e==='INICIO_VIAGEM' || e==='REINICIO_VIAGEM') return ['EM VIAGEM','p-ok'];
  return [e||'SINAL','p-run'];
}

async function carregar(){
  const iso = isoOperacional();
  const alvo = br(iso);
  document.getElementById('subtitulo').textContent = 'Dia operacional '+alvo+' · pulso Trucks';
  let log=[], ctrl=[];
  try{ log = await pull(TRUCKS); }catch(e){ console.warn(e); }
  try{ ctrl = await pull(CONTROLE); }catch(e){ console.warn(e); }

  const evs = [];
  for (let i=1;i<log.length;i++){
    const r=log[i]; if(!r||!r[0]) continue;
    if(String(r[0]).indexOf(alvo)!==0) continue;
    const ev=String(r[1]||'').toUpperCase();
    const pl=placa(r[2]); if(!pl) continue;
    if(['CRIOU','AUTO_CRIOU','ATUALIZOU','SEM_LANC','IGNORA_CD','REFEICAO_SEM_MOT'].includes(ev)) continue;
    evs.push({ ts:r[0], ev, placa:pl, det:String(r[3]||''), hora: hh(r[3])||hh(r[0]) });
  }

  const h = (ctrl[0]||[]).map(x=>String(x).toUpperCase());
  const iOp=h.indexOf('OP'), iVeic=h.findIndex(x=>x.includes('VEIC')), iMot=h.indexOf('MOTORISTA');
  const mapaCtrl={};
  for(let i=1;i<ctrl.length;i++){
    const r=ctrl[i]; if(!r) continue;
    const pl=placa(r[iVeic>=0?iVeic:3]); if(!pl) continue;
    mapaCtrl[pl]={ op:String(r[iOp>=0?iOp:2]||'').toUpperCase(), mot:String(r[iMot>=0?iMot:4]||'') };
  }

  const por={};
  evs.forEach(e=>{ (por[e.placa]=por[e.placa]||[]).push(e); });

  let viagem=0, loja=0, bau=0, ret=0, fim=0, alm=0;
  const linhas=[];
  Object.keys(por).sort().forEach(pl=>{
    const lista=por[pl];
    const last=lista[lista.length-1];
    const [st,cls]=statusDe(lista);
    if(st==='EM VIAGEM'||st==='RETORNO CD') viagem++;
    if(st==='NA LOJA') loja++;
    if(st==='BAÚ ABERTO') { bau++; loja++; }
    if(st==='RETORNO CD') ret++;
    if(st==='FIM') fim++;
    if(st==='ALMOÇO') alm++;
    const info=mapaCtrl[pl]||{};
    linhas.push(`<tr>
      <td style="font-weight:800;letter-spacing:.06em">${pl}</td>
      <td>${info.op?`<span class="pill ${opClass(info.op)}">${info.op}</span>`:'—'}</td>
      <td>${info.mot||'—'}</td>
      <td>${last.ev.replace(/_/g,' ')}</td>
      <td style="font-family:Share Tech Mono,monospace">${last.hora||'—'}</td>
      <td><span class="pill ${cls}">${st}</span></td>
    </tr>`);
  });
  document.getElementById('tbody').innerHTML = linhas.join('') || '<tr><td colspan="6" class="empty">Nenhum evento Trucks neste dia operacional</td></tr>';

  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="l">Sinais hoje</div><div class="n c-cyan">${evs.length}</div></div>
    <div class="kpi"><div class="l">Em viagem / retorno</div><div class="n c-lime">${viagem}</div></div>
    <div class="kpi"><div class="l">Na loja / baú</div><div class="n c-amber">${loja}</div></div>
    <div class="kpi"><div class="l">Baú aberto</div><div class="n c-amber">${bau}</div></div>
    <div class="kpi"><div class="l">Almoço</div><div class="n c-violet">${alm}</div></div>
    <div class="kpi"><div class="l">Encerrados</div><div class="n c-red">${fim}</div></div>`;

  const feed = evs.slice(-40).reverse().map(e=>{
    let cls='e-cli';
    if(e.ev.includes('BAU')||e.ev.includes('DESCARREG')) cls='e-bau';
    else if(e.ev.includes('FIM')) cls='e-fim';
    else if(e.ev.includes('INICIO')) cls='e-ini';
    else if(e.ev.includes('RETORNO')||e.ev.includes('REFEICAO')) cls='e-ret';
    const info=mapaCtrl[e.placa]||{};
    return `<div class="ev ${cls}"><time>${e.hora||'--:--'}</time><div><b>${e.ev.replace(/_/g,' ')}</b><small>${e.placa}${info.mot?' · '+info.mot:''}${info.op?' · '+info.op:''}</small></div></div>`;
  }).join('');
  document.getElementById('feed').innerHTML = feed || '<div class="empty">Sem eventos classificados</div>';
  document.getElementById('rodape').textContent = 'Último pulso '+agoraBRT().toLocaleTimeString('pt-BR')+' · '+Object.keys(por).length+' placas com sinal';
}

function tick(){
  const d=agoraBRT();
  document.getElementById('relogio').textContent=d.toLocaleTimeString('pt-BR');
}
tick(); setInterval(tick,1000);
carregar(); setInterval(carregar,60000);
</script>
</body>
</html>
